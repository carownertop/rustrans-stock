name: Inventory update

on:
  schedule:
    # 10:10, 13:10, 16:10, 19:10 MSK (= 07:10, 10:10, 13:10, 16:10 UTC)
    # After 22:00 MSK — pause until next day 10:10
    - cron: "10 7,10,13,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild inventory page
        run: python3 build.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: inventory update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
