name: Inventory update

on:
  schedule:
    # Каждые 2 ч с 10:10 до 19:10 МСК (07:10…16:10 UTC).
    # 10:10, 12:10, 14:10, 16:10, 18:10, 19:10. Дальше пауза до 10:10.
    - cron: "10 7,9,11,13,15,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild inventory page
        run: python3 build.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: inventory update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
